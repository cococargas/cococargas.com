<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Section with AI Assistant</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Applying Inter font to the body */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Styles for the modal */
        #ai-modal.hidden {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Container for better layout and spacing -->
    <div class="container mx-auto p-8 md:p-12">
        <div class="mt-12 text-center md:text-left">
            <h3 class="text-2xl font-bold text-gray-800 mb-6">O contáctanos directamente</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Contact Information Column -->
                <div class="space-y-4">
                    <!-- Phone Number -->
                    <div class="flex items-center justify-center md:justify-start">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                        <a href="tel:+18094401376" class="text-blue-600 hover:underline text-lg">+1 (809) 440-1376</a>
                    </div>
                    <!-- Email Address with AI Assistant -->
                    <div class="flex flex-col sm:flex-row items-center justify-center md:justify-start space-y-3 sm:space-y-0 sm:space-x-4">
                         <div class="flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                            <a href="mailto:floppycarga@gmail.com" class="text-blue-600 hover:underline text-lg">floppycarga@gmail.com</a>
                        </div>
                        <button id="open-ai-modal-btn" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors shadow">
                            ✨ Redactar correo con IA
                        </button>
                    </div>
                    <!-- Physical Address -->
                    <div class="flex items-center justify-center md:justify-start">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <p class="text-gray-700 text-lg">Av. Jacobo Majluta, Santo Domingo Norte</p>
                    </div>
                </div>
                <!-- Google Maps Iframe Column -->
                <div class="h-64 md:h-auto rounded-lg overflow-hidden shadow-lg">
                     <iframe 
                        title="Google Map Location"
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3782.933231453209!2d-69.95679268510716!3d18.53158998740286!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8eaf89f5799522e9%3A0x6a5e85f351b8c7b8!2sAv.%20Jacobo%20Majluta%2C%20Santo%20Domingo%20Norte%2C%20Dominican%20Republic!5e0!3m2!1sen!2sus!4v1662507130155!5m2!1sen!2sus" 
                        width="100%" 
                        height="100%" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- AI Assistant Modal -->
    <div id="ai-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl transform transition-all">
            <div class="p-6">
                <div class="flex justify-between items-start">
                    <h3 class="text-xl font-bold text-gray-800">✨ Asistente de Correo con IA</h3>
                    <button id="close-ai-modal-btn" class="text-gray-400 hover:text-gray-600">&times;</button>
                </div>
                <p class="text-gray-600 mt-2">Indica brevemente tu consulta y la IA redactará un correo profesional por ti.</p>
                
                <div class="mt-4">
                    <label for="user-inquiry" class="block text-sm font-medium text-gray-700">Tu consulta:</label>
                    <input type="text" id="user-inquiry" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="Ej: Cotización para enviar un paquete a Santiago">
                </div>

                <div class="mt-4">
                    <button id="generate-email-btn" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors shadow-sm flex items-center justify-center">
                        <span id="generate-btn-text">Generar Borrador</span>
                        <svg id="loading-spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </div>

                <div class="mt-6">
                    <label for="generated-email" class="block text-sm font-medium text-gray-700">Borrador Generado:</label>
                    <textarea id="generated-email" rows="10" class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" readonly></textarea>
                </div>
                 <div class="mt-4 flex justify-end">
                    <button id="copy-email-btn" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg font-semibold hover:bg-gray-300 transition-colors text-sm">Copiar al Portapapeles</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // --- Modal Control ---
        const modal = document.getElementById('ai-modal');
        const openBtn = document.getElementById('open-ai-modal-btn');
        const closeBtn = document.getElementById('close-ai-modal-btn');

        openBtn.addEventListener('click', () => modal.classList.remove('hidden'));
        closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
        
        // Close modal if clicking outside the content
        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.classList.add('hidden');
            }
        });

        // --- Gemini API Integration ---
        const generateBtn = document.getElementById('generate-email-btn');
        const generateBtnText = document.getElementById('generate-btn-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        const userInput = document.getElementById('user-inquiry');
        const emailOutput = document.getElementById('generated-email');
        const copyBtn = document.getElementById('copy-email-btn');

        generateBtn.addEventListener('click', async () => {
            const inquiry = userInput.value;
            if (!inquiry) {
                // Using a custom modal for alert instead of window.alert()
                // This part can be enhanced with a more sophisticated modal UI
                emailOutput.value = 'Por favor, introduce tu consulta.';
                return;
            }

            // --- Show loading state ---
            generateBtn.disabled = true;
            generateBtnText.textContent = 'Generando...';
            loadingSpinner.classList.remove('hidden');
            emailOutput.value = '';

            // --- Construct the prompt for the Gemini API ---
            const prompt = `
                Eres un asistente virtual amigable y profesional para "FloppyCarga", una empresa de envíos en la República Dominicana.
                Un cliente quiere enviar un correo electrónico a floppycarga@gmail.com.
                La consulta del cliente es: "${inquiry}".

                Por favor, redacta un correo electrónico claro, conciso y cortés en español.
                - Empieza con un saludo cordial.
                - Expón claramente la consulta del cliente.
                - Termina con una despedida profesional y el nombre del cliente (puedes usar "[Su Nombre]" como marcador de posición).
                - No incluyas una línea de asunto. El cliente la añadirá él mismo.
            `;

            try {
                // --- Call the Gemini API ---
                // NOTE: An API key is not required for this model in this environment.
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{
                        role: "user",
                        parts: [{ text: prompt }]
                    }]
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }

                const result = await response.json();
                
                // --- Display the result ---
                if (result.candidates && result.candidates.length > 0 && result.candidates[0].content.parts[0].text) {
                    const generatedText = result.candidates[0].content.parts[0].text;
                    emailOutput.value = generatedText.trim();
                } else {
                    emailOutput.value = 'Lo siento, no pude generar una respuesta. Por favor, inténtalo de nuevo.';
                }

            } catch (error) {
                console.error('Error calling Gemini API:', error);
                emailOutput.value = 'Error al contactar con el asistente de IA. Por favor, comprueba tu conexión o inténtalo más tarde.';
            } finally {
                // --- Reset loading state ---
                generateBtn.disabled = false;
                generateBtnText.textContent = 'Generar Borrador';
                loadingSpinner.classList.add('hidden');
            }
        });

        // --- Copy to Clipboard ---
        copyBtn.addEventListener('click', () => {
            if (!emailOutput.value) return;

            // Using document.execCommand for better iframe compatibility
            emailOutput.select();
            emailOutput.setSelectionRange(0, 99999); // For mobile devices
            try {
                document.execCommand('copy');
                copyBtn.textContent = '¡Copiado!';
                setTimeout(() => {
                    copyBtn.textContent = 'Copiar al Portapapeles';
                }, 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
                // This part can be enhanced with a more sophisticated modal UI
                emailOutput.value = 'No se pudo copiar el texto.';
            }
            window.getSelection().removeAllRanges();
        });
    </script>

</body>
</html>
